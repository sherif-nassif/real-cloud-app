name: Deploy

on:
  workflow_run:
    workflows: ["Provision Infrastructure"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/415090109691/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-wif@project-d318db8d-3948-41a2-88d.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Wait for instance to be ready
        run: |
          for i in $(seq 1 30); do
            gcloud compute ssh app-server \
              --zone=europe-north2-a \
              --tunnel-through-iap \
              --command="docker --version" && break || sleep 10
          done

      - name: Copy app source to server
        run: |
          gcloud compute scp --recurse \
            --zone=europe-north2-a \
            --tunnel-through-iap \
            app/ app-server:/opt/app/src/

      - name: Build and deploy container
        run: |
          gcloud compute ssh app-server \
            --zone=europe-north2-a \
            --tunnel-through-iap \
            --command="cd /opt/app/src && docker build -t app:latest . && cd /opt/app && docker compose up -d --remove-orphans && docker compose exec app python manage.py migrate --noinput || echo 'No migrations to run'"
